services:
  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg18-trixie
    environment:
      - POSTGRES_USER=cognee
      - POSTGRES_PASSWORD=cognee
      - POSTGRES_DB=cognee_db
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognee -d cognee_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  deepwiki:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8001}:${PORT:-8001}"  # API port
      - "3000:3000"  # Next.js port
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8001}
      - NODE_ENV=production
      - SERVER_BASE_URL=http://localhost:${PORT:-8001}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-logfmt}
      # --- Postgres + pgvector (relational + vector store; legacy user/db
      # names kept: the existing postgres_data volume is initialized with them)
      - DB_PROVIDER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cognee_db
      - DB_USERNAME=cognee
      - DB_PASSWORD=cognee
      # --- LM Studio (OpenAI-compatible server on the host, port 1234) ---
      # extra_hosts below maps host.docker.internal to the host gateway (Linux).
      # On Docker Desktop (macOS/Windows) host.docker.internal already resolves.
      # LM Studio exposes /v1/chat/completions, /v1/embeddings, /v1/models.
      - LOCAL_OPENAI_BASE_URL=${LM_STUDIO_HOST:-http://host.docker.internal:1234}/v1
      - LOCAL_OPENAI_API_KEY=${LOCAL_OPENAI_API_KEY:-not-needed}
      - LOCAL_OPENAI_MODEL=${LOCAL_OPENAI_MODEL:-qwen/qwen3.6-27b}
      # --- Productarium state (repo clones, SQLite checkpointer fallback) ---
      - PRODUCTARIUM_STATE_DIR=/var/lib/productarium
      # --- Productarium auth + settings ---
      - AUTH_PROVIDER=${AUTH_PROVIDER:-local}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-admin}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-change-me}
      - SETTINGS_SECRET_KEY=${SETTINGS_SECRET_KEY:-}
    # Allow the container to reach the host OpenAI-compatible server (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist managed state dir: docgen repo clones + SQLite checkpointer fallback
      - productarium_state:/var/lib/productarium
    # Resource limits for docker-compose up (not Swarm mode)
    mem_limit: 6g
    mem_reservation: 2g
    networks:
      - app-network

    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8001}/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- Keycloak database (separate postgres) ---
  kkdb:
    container_name: kkdb
    image: postgres:17
    environment:
      - POSTGRES_USER=${KEYCLOAK_DB_USER:-keycloak}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      - POSTGRES_DB=${KEYCLOAK_DB_NAME:-keycloak}
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    # Host port 5433 maps to the container's default postgres port 5432.
      # Keycloak connects to kkdb:5432 internally (KC_DB_URL below), so the
      # container MUST listen on 5432 — do NOT add `command: postgres -p 5433`,
      # which would make postgres listen on 5433 and break Keycloak's connection.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # --- Keycloak (OIDC provider) ---
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.3
    depends_on:
      kkdb:
        condition: service_healthy
    command: ["start-dev", "--import-realm"]
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://kkdb:5432/${KEYCLOAK_DB_NAME:-keycloak}
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER:-keycloak}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r' >&3; cat <&3 | head -1 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  keycloak_pg_data:
  keycloak_data:
  productarium_state:

networks:
    app-network:
        driver: bridge
