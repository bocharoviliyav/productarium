[project]
name = "open-deepwiki-api"
version = "1.0.0"
description = "Backend API for DeepWiki, providing smart code analysis and AI-powered documentation generation."
license = {text = "MIT License"}

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.95.0"
uvicorn = { extras = ["standard"], version = ">=0.21.1" }
pydantic = ">=2.0.0"
tiktoken = ">=0.5.0"
numpy = ">=1.24.0"
requests = ">=2.28.0"
jinja2 = ">=3.1.2"
pyyaml = ">=6.0"
python-dotenv = ">=1.0.0"
openai = ">=1.76.2"
aiohttp = ">=3.8.4"
websockets = ">=11.0.3"
sqlalchemy = ">=2.0"
psycopg = { version = ">=3.1", extras = ["binary"] }
# pgvector: direct dependency for the pgvector memory backend (cosine recall
# over the knowledge_chunks table, HNSW index).
pgvector = ">=0.3.0"

# --- LangChain agent stack (Wave A foundation) ---
# LLM client: single OpenAI-compatible path via langchain-openai (ChatOpenAI,
# OpenAIEmbeddings) with the patched openai SDK retained below.
langchain = ">=0.3"
langchain-openai = ">=0.3"
langchain-text-splitters = ">=0.3"
# Orchestration for the agent waves (deep-research / docgen agents).
langgraph = ">=0.4"
# Persistent LangGraph checkpointer backends: Postgres in production, SQLite
# as the degraded/test backend for the expert agent chat sessions (Wave B).
langgraph-checkpoint-postgres = ">=2.0"
langgraph-checkpoint-sqlite = ">=2.0"
# deepagents: agentic docgen stack for the codebase documentation wave.
deepagents = ">=0.1"
# MCP integration (product-scoped MCP connectors, postgres/oracle MCP servers).
langchain-mcp-adapters = ">=0.1"
mcp = ">=1.0"

# --- Productarium foundation: auth, settings, integrations ---
# Auth: local (passlib bcrypt) + Keycloak (authlib OIDC) + JWT session cookies.
authlib = ">=1.2.0"
passlib = { version = ">=1.7.4", extras = ["bcrypt"] }
pyjwt = ">=2.8.0"
# Settings store: Fernet encryption of admin-configured secrets.
cryptography = ">=41.0.0"
# Form uploads (markitdown file conversion).
python-multipart = ">=0.0.6"
# markitdown converts uploaded/ingested files (docx/pdf/pptx/html/xlsx) to MD.
markitdown = ">=0.0.1"
# tqdm: TTY progress bar for docgen jobs (disable=None -> no-op when piped).
tqdm = ">=4.66"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
